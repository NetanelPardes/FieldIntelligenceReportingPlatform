services:
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    restart: unless-stopped

    ports:
      - "9200:9200"

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: Producer/Dockerfile

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REPORTS_TOPIC: ${REPORTS_TOPIC}
      REPORTS_FILE_PATH: ${REPORTS_FILE_PATH}

  consumer:
    build:
      context: .
      dockerfile: Consumer/Dockerfile

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REPORTS_TOPIC: ${REPORTS_TOPIC}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID}
      ELASTICSEARCH_URL: http://elasticsearch:9200

volumes:
  elasticsearch-data: